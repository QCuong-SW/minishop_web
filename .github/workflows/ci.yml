name: MiniShop CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do not allow two releases to rebuild/restart the same EC2 stack at once.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  database:
    name: MySQL schema and seed tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if database tests exist
        id: check
        run: |
          if [ -f "database/tests/run.sh" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ database/tests/run.sh not found, skipping"
          fi
      - name: Prepare environment
        if: steps.check.outputs.exists == 'true'
        run: cp .env.example .env
      - name: Start MySQL and backend
        if: steps.check.outputs.exists == 'true'
        run: docker compose up -d mysql backend
      - name: Install MySQL client
        if: steps.check.outputs.exists == 'true'
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Test schema, seed and constraints
        if: steps.check.outputs.exists == 'true'
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DB_DATABASE: shopee_mini
          DB_USERNAME: app
          DB_PASSWORD: app
        run: bash database/tests/run.sh
      - name: Show MySQL logs on failure
        if: failure()
        run: docker compose logs mysql
      - name: Stop MySQL
        if: always() && steps.check.outputs.exists == 'true'
        run: docker compose down -v

  backend:
    name: Backend lint and unit tests
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      JWT_ISSUER: minishop-api
      JWT_AUDIENCE: minishop-web
      JWT_TTL: 3600
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql
      - name: PHP syntax check
        run: find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Backend unit tests
        run: |
          if [ -f "backend/tests/run.php" ]; then
            php backend/tests/run.php
          else
            echo "⚠️ backend/tests/run.php not found, skipping"
          fi

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests
        run: |
          if find tests -name '*.test.*' 2>/dev/null | grep -q .; then
            npm run test:unit
          else
            echo "⚠️ No test files found, skipping unit tests"
          fi
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api
          NEXT_PUBLIC_ENABLE_MOCK_FALLBACK: "false"

  e2e:
    name: Playwright smoke and responsive tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check if E2E tests exist
        id: check_e2e
        run: |
          if find tests -name '*.spec.*' 2>/dev/null | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ No E2E test files found, skipping"
          fi
      - name: Install Playwright
        if: steps.check_e2e.outputs.exists == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        if: steps.check_e2e.outputs.exists == 'true'
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_API_URL: ""
          NEXT_PUBLIC_ENABLE_MOCK_FALLBACK: "true"
      - uses: actions/upload-artifact@v4
        if: always() && steps.check_e2e.outputs.exists == 'true'
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  deploy:
    name: Deploy production to EC2
    needs: [database, backend, frontend, e2e]
    if: >-
      ${{
        needs.database.result == 'success' &&
        needs.backend.result == 'success' &&
        needs.frontend.result == 'success' &&
        needs.e2e.result == 'success' &&
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$EC2_HOST"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key
          ssh-keyscan -T 10 -H "$EC2_HOST" >> ~/.ssh/known_hosts
      - name: Validate production environment file
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          set -euo pipefail
          required_vars=(
            DB_DATABASE DB_USERNAME DB_PASSWORD MYSQL_ROOT_PASSWORD
            APP_ENV APP_URL JWT_SECRET JWT_ISSUER JWT_AUDIENCE JWT_TTL
            FRONTEND_URL NEXT_PUBLIC_API_URL NEXT_PUBLIC_ENABLE_MOCK_FALLBACK DOMAIN
          )
          if [ -z "$(printf '%s' "$PROD_ENV_FILE" | tr -d '[:space:]')" ]; then
            echo "::error::GitHub secret PROD_ENV_FILE is empty. Deployment was not started."
            exit 1
          fi
          for variable in "${required_vars[@]}"; do
            if ! printf '%s\n' "$PROD_ENV_FILE" | grep -qE "^${variable}=[^[:space:]].*$"; then
              echo "::error::PROD_ENV_FILE is missing a non-empty ${variable} entry."
              exit 1
            fi
          done
      - name: Sync application
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.github/' \
            --exclude '.kilo/' \
            --exclude 'minishop_web/' \
            --exclude 'deploy/certbot/conf/' \
            --exclude 'frontend/node_modules/' \
            --exclude 'frontend/.next/' \
            --exclude 'frontend/tsconfig.tsbuildinfo' \
            -e 'ssh -i ~/.ssh/ec2_deploy_key -o BatchMode=yes' \
            ./ "${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }}:/home/${{ secrets.AWS_EC2_USER }}/minishop_web/"
      - name: Install production environment file
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          printf '%s\n' "$PROD_ENV_FILE" | ssh -i ~/.ssh/ec2_deploy_key -o BatchMode=yes \
            "${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }}" \
            'set -eu; umask 077; project=/home/'"${{ secrets.AWS_EC2_USER }}"'/minishop_web; mkdir -p "$project"; temporary_env=$(mktemp "$project/.env.tmp.XXXXXX"); trap "rm -f \"$temporary_env\"" EXIT; cat > "$temporary_env"; for variable in DB_DATABASE DB_USERNAME DB_PASSWORD MYSQL_ROOT_PASSWORD APP_ENV APP_URL JWT_SECRET JWT_ISSUER JWT_AUDIENCE JWT_TTL FRONTEND_URL NEXT_PUBLIC_API_URL NEXT_PUBLIC_ENABLE_MOCK_FALLBACK DOMAIN; do grep -qE "^${variable}=[^[:space:]].*$" "$temporary_env" || { echo "Invalid production environment file: missing $variable" >&2; exit 1; }; done; mv "$temporary_env" "$project/.env"; trap - EXIT'
      - name: Build and restart production stack
        run: |
          ssh -i ~/.ssh/ec2_deploy_key -o BatchMode=yes \
            "${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }}" \
            'cd /home/'"${{ secrets.AWS_EC2_USER }}"'/minishop_web && \
             sudo docker compose -p minishop_web -f docker-compose.yml -f docker-compose.prod.yml up -d --build mysql backend frontend proxy && \
             for attempt in $(seq 1 30); do \
               curl -fsS http://127.0.0.1/ >/dev/null && \
               curl -fsS http://127.0.0.1/api/products >/dev/null && exit 0; \
               sleep 2; \
             done; \
             sudo docker compose -p minishop_web -f docker-compose.yml -f docker-compose.prod.yml ps; \
             sudo docker compose -p minishop_web -f docker-compose.yml -f docker-compose.prod.yml logs --tail=100 backend frontend proxy; \
             exit 1'
