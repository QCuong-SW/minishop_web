name: MiniShop CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  database:
    name: MySQL schema and seed tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if database tests exist
        id: check
        run: |
          if [ -f "database/tests/run.sh" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ database/tests/run.sh not found, skipping"
          fi
      - name: Prepare environment
        if: steps.check.outputs.exists == 'true'
        run: cp .env.example .env
      - name: Start MySQL and backend
        if: steps.check.outputs.exists == 'true'
        run: docker compose up -d mysql backend
      - name: Install MySQL client
        if: steps.check.outputs.exists == 'true'
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Test schema, seed and constraints
        if: steps.check.outputs.exists == 'true'
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DB_DATABASE: shopee_mini
          DB_USERNAME: app
          DB_PASSWORD: app
        run: bash database/tests/run.sh
      - name: Show MySQL logs on failure
        if: failure()
        run: docker compose logs mysql
      - name: Stop MySQL
        if: always() && steps.check.outputs.exists == 'true'
        run: docker compose down -v

  backend:
    name: Backend lint and unit tests
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      JWT_ISSUER: minishop-api
      JWT_AUDIENCE: minishop-web
      JWT_TTL: 3600
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql
      - name: PHP syntax check
        run: find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Backend unit tests
        run: |
          if [ -f "backend/tests/run.php" ]; then
            php backend/tests/run.php
          else
            echo "⚠️ backend/tests/run.php not found, skipping"
          fi

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests
        run: |
          if find tests -name '*.test.*' 2>/dev/null | grep -q .; then
            npm run test:unit
          else
            echo "⚠️ No test files found, skipping unit tests"
          fi
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api
          NEXT_PUBLIC_ENABLE_MOCK_FALLBACK: "false"

  e2e:
    name: Playwright smoke and responsive tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check if E2E tests exist
        id: check_e2e
        run: |
          if find tests -name '*.spec.*' 2>/dev/null | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ No E2E test files found, skipping"
          fi
      - name: Install Playwright
        if: steps.check_e2e.outputs.exists == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        if: steps.check_e2e.outputs.exists == 'true'
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_API_URL: ""
          NEXT_PUBLIC_ENABLE_MOCK_FALLBACK: "true"
      - uses: actions/upload-artifact@v4
        if: always() && steps.check_e2e.outputs.exists == 'true'
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
