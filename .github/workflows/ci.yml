name: MiniShop CI

on:
  push:
    branches: [main, NDKien]
  pull_request:

permissions:
  contents: read

jobs:
  database:
    name: MySQL schema and seed tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: cp .env.example .env
      - name: Start MySQL and backend
        run: docker compose up -d mysql backend
      - name: Test schema, seed and constraints
        run: bash database/tests/run.sh
      - name: Show MySQL logs on failure
        if: failure()
        run: docker compose logs mysql
      - name: Stop MySQL
        if: always()
        run: docker compose down -v

  backend:
    name: Backend lint and unit tests
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      JWT_ISSUER: minishop-api
      JWT_AUDIENCE: minishop-web
      JWT_TTL: 3600
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql
      - name: PHP syntax check
        run: find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Backend unit tests
        run: php backend/tests/run.php

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api
          NEXT_PUBLIC_ENABLE_MOCK_FALLBACK: "false"

  e2e:
    name: Playwright smoke and responsive tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
