services:
  mysql:
    # MySQL is reachable by the backend over the private Compose network.
    ports: !reset []

  backend:
    ports: !reset []
    # The development bind mount would override the image built by CD.
    volumes: !reset []

  frontend:
    ports: !reset []

  phpmyadmin:
    # Keep database administration tooling out of the production stack. Start it
    # explicitly with `--profile tools` on a secured host when it is needed.
    ports: !reset []
    profiles: ["tools"]

  proxy:
    image: nginx:1.27-alpine
    container_name: shopee-mini-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/minishop-ssl.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - backend
      - frontend
    networks:
      - shopee-network

  certbot:
    image: certbot/certbot:v2.11.0
    profiles: ["certbot"]
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
