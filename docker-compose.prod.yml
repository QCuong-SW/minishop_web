services:
  mysql:
    # MySQL is reachable by the backend over the private Compose network.
    ports: !reset []

  backend:
    ports: !reset []

  frontend:
    ports: !reset []

  phpmyadmin:
    ports:
      - "127.0.0.1:${PHPMYADMIN_HOST_PORT:-8080}:80"

  proxy:
    image: nginx:1.27-alpine
    container_name: shopee-mini-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/minishop-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - shopee-network
